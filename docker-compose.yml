# Devir artefaktı: `docker compose up` ile Postgres + API ayağa kalkar (ADR-0001).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evidex
      POSTGRES_PASSWORD: evidex
      POSTGRES_DB: evidex
    ports:
      - '5433:5432' # ⚠ 5433: yerel Postgres 5432'yi tutuyor olabilir
    volumes:
      - evidex_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evidex']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://evidex:evidex@db:5432/evidex
    ports:
      - '3100:3100'
    depends_on:
      db:
        condition: service_healthy

volumes:
  evidex_pg:
