name: deploy
# Ana dala push → CI yeşilse imaj ghcr.io'ya; DEPLOY_HOST sırrı tanımlıysa sunucuda compose yenilenir.
# Sırlar yoksa iş sessizce atlanmaz: ikinci iş "skipped" görünür, gerekçe adımda yazar.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Üst üste iki deploy aynı konteyneri yeniden kurmasın (yarışta biri ötekinin konteynerini siler).
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  image:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/wmb-tech/zemin360:latest
            ghcr.io/wmb-tech/zemin360:${{ github.event.workflow_run.head_sha }}

  # Dağıtımı sunucudaki CI yapar (evidex-ci.timer: her yeni main → kapı → imaj → compose up).
  # Bu iş de dağıtınca iki aktör aynı konteyneri yarışarak yeniden kuruyordu (7 Eki: 8 dk 502).
  # Tek dağıtıcı kalsın diye kapalı; imaj ghcr'a yine gider (geri dönüş için sha etiketiyle).
  # Sunucu CI'ı kapatılırsa bu satırı silmek yeterli.
  server:
    if: false
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sunucu sırrı var mı
        id: gate
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "DEPLOY_HOST tanımsız; sunucu adımı atlandı (docs/06-canli-ortam.md)"; echo "go=no" >> "$GITHUB_OUTPUT"
          else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - name: Compose yenile
        if: steps.gate.outputs.go == 'yes'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # Sunucuda deploy kullanıcısının sudo yetkisi yalnız bu compose dosyasıyla sınırlı
            # Sunucuda başka bir aktör (eski CI zamanlayıcısı) aynı anda yeniden kurarsa çekme ya da
            # yeniden kurma "No such container" / "commit failed" ile düşebilir; 7 Eki'de site bu
            # yüzden 8 dk kapalı kaldı. Üç deneme: biri tutar, konteyner açıkta kalmaz.
            for t in 1 2 3; do
              sudo /usr/bin/docker compose -f /opt/evidex/docker-compose.yml pull api && break
              echo "pull denemesi $t düştü"; sleep 15
            done
            for t in 1 2 3; do
              sudo /usr/bin/docker compose -f /opt/evidex/docker-compose.yml up -d && break
              echo "up denemesi $t düştü"; sleep 15
            done
            sudo /usr/bin/docker image prune -f
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:3100/api/health >/dev/null 2>&1 || sudo /usr/bin/docker logs evidex-api 2>&1 | grep -q "evidex-api :3100"; then echo "api ayakta"; exit 0; fi
              sleep 2
            done
            echo "api açılmadı"; sudo /usr/bin/docker logs --tail 50 evidex-api; exit 1
