name: ops
# Sunucu işletimi, elle tetiklenir (yalnız repo yazma yetkisi olanlar). Komutlar sabit: girdi
# olarak serbest komut alınmaz. Deploy kullanıcısıyla bağlanır; sudo yetkisi compose ile sınırlı.
on:
  workflow_dispatch:
    inputs:
      is:
        description: 'teshis / ci-incele: yalnız okur · bekci-kur: sağlık bekçisini kurar'
        required: true
        default: teshis
        type: choice
        options: [teshis, ci-incele, bekci-kur]

jobs:
  sunucu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Teşhis (değişiklik yapmaz)
        if: inputs.is == 'teshis'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "== kim"; whoami; id
            echo "== sudo"; sudo -n -l 2>&1 | tail -n 15
            echo "== zamanlayicilar"; systemctl list-timers --all --no-pager 2>&1 | grep -i -E "evidex|ci|deploy|backup|yedek" || echo "(eşleşen yok)"
            echo "== servisler"; systemctl list-units --all --no-pager --type=service 2>&1 | grep -i -E "evidex|ci" || echo "(eşleşen yok)"
            echo "== unit dosyalari"; ls -la /etc/systemd/system 2>&1 | grep -i -E "evidex|ci" || echo "(yok)"
            echo "== cron (deploy)"; crontab -l 2>&1 | grep -v "^#" || true
            echo "== cron (sistem)"; ls -la /etc/cron.d 2>&1; grep -il evidex /etc/cron.d/* /etc/crontab 2>/dev/null || echo "(evidex geçen cron yok)"
            echo "== /opt/evidex"; ls -la /opt/evidex 2>&1
            echo "== ci klasoru"; ls -la /opt/evidex/ci 2>&1 | head -n 20
            echo "== yedekler"; ls -la /opt/evidex/backups 2>&1 | tail -n 10
            echo "== disk"; df -h / | tail -n 1
            echo "== konteynerler"; sudo -n /usr/bin/docker compose -f /opt/evidex/docker-compose.yml ps 2>&1

      - name: Sunucu CI incele (değişiklik yapmaz)
        if: inputs.is == 'ci-incele'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "== unit"; cat /etc/systemd/system/*-ci.service /etc/systemd/system/*-ci.timer 2>&1
            echo "== loglar"; ls -la /opt/*/ci/logs 2>&1 | tail -n 8
            son=$(ls -t /opt/*/ci/logs/* 2>/dev/null | head -n 1); echo "== son log: $son"; tail -n 40 "$son" 2>&1
            echo "== last_sha"; cat /opt/*/ci/last_sha 2>&1

      - name: Sağlık bekçisini kur (idempotent)
        if: inputs.is == 'bekci-kur'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            D=/opt/evidex
            cat > $D/bekci.sh <<'BEKCI'
            #!/bin/sh
            # Sağlık bekçisi (deploy kullanıcısının cron'u, 2 dk): API art arda 3 kez cevap vermezse
            # compose up -d ile ayağa kaldırır. Kurulum: ops.yml → bekci-kur.
            D=/opt/evidex; S=$D/backups/bekci.durum; L=$D/backups/bekci.log
            if curl -sf -m 10 https://evidex.wmbyazilim.com/api/health >/dev/null; then echo 0 > $S; exit 0; fi
            n=$(( $(cat $S 2>/dev/null || echo 0) + 1 )); echo $n > $S
            echo "$(date -u +%FT%TZ) sağlık yok ($n)" >> $L
            if [ "$n" -ge 3 ]; then
              sudo -n /usr/bin/docker compose -f $D/docker-compose.yml up -d >> $L 2>&1
              echo "$(date -u +%FT%TZ) onarım denendi" >> $L; echo 0 > $S
            fi
            BEKCI
            sed -i 's/^            //' $D/bekci.sh
            chmod 755 $D/bekci.sh
            ( crontab -l 2>/dev/null | grep -v 'bekci.sh' ; echo '*/2 * * * * /opt/evidex/bekci.sh' ) | crontab -
            echo "== cron"; crontab -l
            echo "== deneme"; $D/bekci.sh && echo "bekçi çalıştı, durum: $(cat $D/backups/bekci.durum)"
